schema = "v1"

[service]
name    = "products-service"
version = "0.1.0"
codec   = "prost"
port    = 50053

[deploy]
replicas    = 2
mesh        = "cilium"
mcp_sidecar = true
namespace   = "shop"

# Small pod: product catalog, stateless read-mostly.
[resources]
cpu    = "100m"
memory = "128Mi"

[autoscale]
max_replicas = 5
