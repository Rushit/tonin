# Automated release management via release-please.
#
# On every push to main, release-please reads Conventional Commits since
# the last release tag and either:
#   a) Opens / updates a Release PR (chore: bump + CHANGELOG) when new
#      commits are present, or
#   b) Creates the GitHub Release + pushes the semver tag when a Release PR
#      is merged into main.
#
# Conventional Commit → bump rules:
#   fix:              → PATCH
#   feat:             → MINOR
#   feat! / BREAKING  → MINOR (capped by bump-minor-pre-major: true — no
#                       auto-major while version < 1.0.0)
#   anything else     → PATCH (safe default)
#
# Two packages are versioned independently:
#   tonin         — root "."; tag  v*.*.*
#   tonin-sdk     — crates/tonin-sdk; tag  tonin-sdk-v*.*.*
#
# Each package gets its own Release PR (separate-pull-requests: true).
# The automerge job squash-merges Release PRs (no approval required —
# ruleset has required_approving_review_count: 0).
#
# IMPORTANT — GITHUB_TOKEN pushing a tag does NOT trigger other workflows
# (GitHub anti-loop protection). The dispatch job reads .release-please-manifest.json
# to find newly released versions and dispatches release.yml / release-tonin-sdk.yml
# via workflow_dispatch, which IS honoured even from GITHUB_TOKEN.
#
# Token: uses the default GITHUB_TOKEN (no extra secrets needed).
# Prerequisite: Settings → Actions → General →
#   "Allow GitHub Actions to create and approve pull requests" must be ON.

name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Open / update Release PRs and, when a Release PR is merged, create the
  # GitHub Release and push the version tag.
  # ---------------------------------------------------------------------------
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pr: ${{ steps.rp.outputs.pr }}
      releases_created: ${{ steps.rp.outputs.releases_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: .github/release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Auto-merge Release PRs.
  # The repo ruleset has required_approving_review_count: 0 so no approval is
  # needed — plain squash merge works without --admin or extra permissions.
  # ---------------------------------------------------------------------------
  automerge:
    name: Auto-merge Release PRs
    needs: release-please
    if: ${{ needs.release-please.outputs.pr != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Squash-merge Release PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # With separate-pull-requests:true, outputs.pr may be an array.
          echo '${{ needs.release-please.outputs.pr }}' \
            | jq -r 'if type == "array" then .[].number else .number end' \
            | while read -r pr_number; do
                [ -z "$pr_number" ] || [ "$pr_number" = "null" ] && continue
                echo "Merging release PR #${pr_number}..."
                gh pr merge "$pr_number" \
                  --squash \
                  --repo "$GITHUB_REPOSITORY"
              done

  # ---------------------------------------------------------------------------
  # When release-please creates tags, dispatch the publish/build workflows.
  # GITHUB_TOKEN tag-pushes do NOT trigger other workflow runs (GitHub
  # anti-loop protection). Calling workflow_dispatch via API sidesteps this.
  #
  # Strategy: read .release-please-manifest.json (which now holds the just-
  # released versions) to construct tag names, verify the GitHub Release
  # exists, then dispatch.
  # ---------------------------------------------------------------------------
  dispatch-release:
    name: Dispatch publish workflows
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Dispatch release workflows for newly created tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TONIN_VER=$(jq -r '."."' .release-please-manifest.json)
          SDK_VER=$(jq -r '."crates/tonin-sdk"' .release-please-manifest.json)
          TONIN_TAG="v${TONIN_VER}"
          SDK_TAG="tonin-sdk-v${SDK_VER}"

          if gh release view "$TONIN_TAG" --repo "$GITHUB_REPOSITORY" &>/dev/null; then
            echo "Dispatching release.yml for ${TONIN_TAG}..."
            gh workflow run release.yml \
              --ref "$TONIN_TAG" \
              --repo "$GITHUB_REPOSITORY"
          fi

          if gh release view "$SDK_TAG" --repo "$GITHUB_REPOSITORY" &>/dev/null; then
            echo "Dispatching release-tonin-sdk.yml for ${SDK_TAG}..."
            gh workflow run release-tonin-sdk.yml \
              --ref "$SDK_TAG" \
              --repo "$GITHUB_REPOSITORY"
          fi
