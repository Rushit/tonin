# Automated release management via release-please.
#
# On every push to main, release-please reads Conventional Commits since
# the last release tag and either:
#   a) Opens / updates a Release PR (chore: bump + CHANGELOG) when new
#      commits are present, or
#   b) Creates the GitHub Release + pushes the semver tag when a Release PR
#      is merged into main.
#
# Conventional Commit → bump rules:
#   fix:              → PATCH
#   feat:             → MINOR
#   feat! / BREAKING  → MINOR (capped by bump-minor-pre-major: true — no
#                       auto-major while version < 1.0.0)
#   anything else     → PATCH (safe default)
#
# Two packages are versioned independently:
#   tonin         — root "."; tag  v*.*.*
#   tonin-sdk     — crates/tonin-sdk; tag  tonin-sdk-v*.*.*
#
# Each package gets its own Release PR (separate-pull-requests: true).
# The automerge job squash-merges any open Release PR immediately (using
# --admin to bypass ruleset review requirements), which re-triggers this
# workflow; release-please detects the merge and creates the tag + GitHub
# Release in that second run.
#
# IMPORTANT — GITHUB_TOKEN pushing a tag does NOT trigger other workflows
# (GitHub's anti-loop protection). The dispatch job explicitly calls
# workflow_dispatch on release.yml / release-tonin-sdk.yml after tags are
# created so crates.io publish and binary builds run.
#
# Token: uses the default GITHUB_TOKEN (no extra secrets needed).
# Prerequisite: Settings → Actions → General →
#   "Allow GitHub Actions to create and approve pull requests" must be ON.

name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Open / update Release PRs and, when a Release PR is merged, create the
  # GitHub Release and push the version tag.
  # ---------------------------------------------------------------------------
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pr: ${{ steps.rp.outputs.pr }}
      releases_created: ${{ steps.rp.outputs.releases_created }}
      tonin_tag: ${{ steps.rp.outputs['--tag_name'] }}
      sdk_tag: ${{ steps.rp.outputs['crates/tonin-sdk--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: .github/release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Auto-merge the Release PR with a squash commit.
  # Uses --admin to bypass the repository ruleset's review requirement.
  # administration: write gives GITHUB_TOKEN the admin-level merge rights.
  # ---------------------------------------------------------------------------
  automerge:
    name: Auto-merge Release PRs
    needs: release-please
    if: ${{ needs.release-please.outputs.pr != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      administration: write
    steps:
      - name: Squash-merge Release PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # With separate-pull-requests:true and two packages, outputs.pr is a
          # JSON array. Handle both array and single-object shapes.
          echo '${{ needs.release-please.outputs.pr }}' \
            | jq -r 'if type == "array" then .[].number else .number end' \
            | while read -r pr_number; do
                [ -z "$pr_number" ] || [ "$pr_number" = "null" ] && continue
                echo "Merging release PR #${pr_number}..."
                gh pr merge "$pr_number" \
                  --squash \
                  --admin \
                  --repo "$GITHUB_REPOSITORY"
              done

  # ---------------------------------------------------------------------------
  # When release-please creates tags, explicitly dispatch the publish/build
  # workflows. GITHUB_TOKEN tag-pushes do not trigger other workflows (GitHub
  # anti-loop protection), so we must call workflow_dispatch manually.
  # ---------------------------------------------------------------------------
  dispatch-release:
    name: Dispatch publish workflows
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Trigger release.yml for tonin tag
        if: ${{ needs.release-please.outputs.tonin_tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tonin_tag }}
        run: |
          echo "Dispatching release.yml for $TAG..."
          gh workflow run release.yml \
            --ref "$TAG" \
            --repo "$GITHUB_REPOSITORY"

      - name: Trigger release-tonin-sdk.yml for tonin-sdk tag
        if: ${{ needs.release-please.outputs.sdk_tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.sdk_tag }}
        run: |
          echo "Dispatching release-tonin-sdk.yml for $TAG..."
          gh workflow run release-tonin-sdk.yml \
            --ref "$TAG" \
            --repo "$GITHUB_REPOSITORY"
