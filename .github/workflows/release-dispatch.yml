# release-dispatch.yml
#
# Detects a manual version bump commit (produced by `make bump VERSION=X.Y.Z`)
# and automatically creates tags, GitHub Releases, and dispatches the three
# publish workflows so artifacts are built without any extra manual steps.
#
# Trigger pattern:
#   Any push to main whose HEAD commit message contains "[manual bump]"
#   (that marker is injected by `make bump` / `make release`).
#
# What it does for each package whose tag does NOT yet exist on origin:
#   1. Creates the semver tag.
#   2. Creates the GitHub Release.
#   3. Dispatches the corresponding publish workflow against that tag.
#
# Idempotency AND "which packages changed" are both decided by TAG EXISTENCE,
# not by the release-please manifest. The bump scripts (scripts/bump-version.sh
# et al.) already pre-sync .release-please-manifest.json *inside the bump
# commit* — so release-please stays coherent and won't double-release a manual
# bump, and we never have to push the manifest to protected main from here.
# A side effect of that pre-sync is that manifest == VERSION by the time this
# workflow runs, so the manifest can no longer tell us what changed. The tag is
# the source of truth instead: a package is released here iff its tag is missing
# on origin; already-tagged versions are skipped (safe to re-run / partial bump).
#
# Packages & their workflows:
#   .                → v{ver}              → release.yml
#   crates/tonin-sdk → tonin-sdk-v{ver}   → release-tonin-sdk.yml
#   crates/tonin-proxy→ tonin-proxy-v{ver} → release-tonin-proxy.yml
#
# Developer workflow:
#   make bump VERSION=1.2.0     # bumps all 3 packages, creates local commit
#   make release VERSION=1.2.0  # same + push → this workflow fires automatically

name: Release Dispatch

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Force-dispatch for this version (e.g. 0.8.3). Leave blank to read from VERSION files.'
        required: false
        type: string

permissions:
  contents: write   # push tags + manifest update
  actions: write    # gh workflow run

jobs:
  dispatch:
    name: Detect manual bump and dispatch release workflows
    runs-on: ubuntu-latest

    # Only run when:
    #   a) workflow_dispatch (manual trigger, always run)
    #   b) push to main whose HEAD commit contains [manual bump]
    if: >
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[manual bump]')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # GITHUB_TOKEN is sufficient: we only push tags here. Tag pushes made
          # with GITHUB_TOKEN intentionally do NOT re-trigger tag-triggered
          # workflows (GitHub anti-loop protection), so the publish workflows are
          # dispatched explicitly via `gh workflow run` below instead.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read VERSION files
        id: versions
        run: |
          set -euo pipefail

          # Allow workflow_dispatch to override
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TONIN_VER="${{ github.event.inputs.version }}"
            SDK_VER="$TONIN_VER"
            PROXY_VER="$TONIN_VER"
          else
            TONIN_VER=$(tr -d '[:space:]' < VERSION)
            SDK_VER=$(tr -d '[:space:]' < crates/tonin-sdk/VERSION)
            PROXY_VER=$(tr -d '[:space:]' < crates/tonin-proxy/VERSION)
          fi

          MF_TONIN=$(jq -r '."."'               .release-please-manifest.json)
          MF_SDK=$(jq -r '."crates/tonin-sdk"'  .release-please-manifest.json)
          MF_PROXY=$(jq -r '."crates/tonin-proxy"' .release-please-manifest.json)

          echo "tonin_ver=$TONIN_VER"    >> "$GITHUB_OUTPUT"
          echo "sdk_ver=$SDK_VER"        >> "$GITHUB_OUTPUT"
          echo "proxy_ver=$PROXY_VER"    >> "$GITHUB_OUTPUT"
          echo "mf_tonin=$MF_TONIN"      >> "$GITHUB_OUTPUT"
          echo "mf_sdk=$MF_SDK"          >> "$GITHUB_OUTPUT"
          echo "mf_proxy=$MF_PROXY"      >> "$GITHUB_OUTPUT"

          echo "┌─────────────────────────────────────┐"
          echo "│  Package       VERSION    Manifest   │"
          echo "├─────────────────────────────────────┤"
          printf "│  %-14s %-10s %-10s │\n" "tonin"       "$TONIN_VER" "$MF_TONIN"
          printf "│  %-14s %-10s %-10s │\n" "tonin-sdk"   "$SDK_VER"   "$MF_SDK"
          printf "│  %-14s %-10s %-10s │\n" "tonin-proxy" "$PROXY_VER" "$MF_PROXY"
          echo "└─────────────────────────────────────┘"

      - name: Create tags, releases and dispatch workflows
        id: dispatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          TONIN_VER="${{ steps.versions.outputs.tonin_ver }}"
          SDK_VER="${{ steps.versions.outputs.sdk_ver }}"
          PROXY_VER="${{ steps.versions.outputs.proxy_ver }}"

          DISPATCHED=false

          # ── handle_package <pkg> <ver> <tag> <workflow> ─────────────────────
          # A package is released iff its tag does not yet exist on origin.
          # That single check is BOTH the "did this version change" signal and
          # the idempotency guard, so re-runs and partial bumps are safe:
          #   - new version  → tag missing → tag + release + dispatch
          #   - unchanged    → tag exists  → skip (nothing to do)
          handle_package() {
            local pkg="$1" ver="$2" tag="$3" workflow="$4"

            # ls-remote with the full ref path returns output only if the exact
            # tag exists — no substring match against unrelated tags.
            if [ -n "$(git ls-remote --tags origin "refs/tags/${tag}")" ]; then
              echo "::notice::${pkg} ${ver}: tag ${tag} already exists — already released, skipping."
              return
            fi

            echo "──────────────────────────────────────────────"
            echo "  ${pkg}: releasing ${ver} (tag: ${tag})"
            echo "──────────────────────────────────────────────"

            # 1. Tag (annotated, pushed with GITHUB_TOKEN — does not self-trigger)
            git tag -a "${tag}" -m "Release ${tag}"
            git push origin "${tag}"
            echo "  ✔ pushed tag ${tag}"

            # 2. GitHub Release
            if gh release view "${tag}" --repo "${{ github.repository }}" &>/dev/null; then
              echo "  GitHub Release ${tag} already exists — skipping."
            else
              gh release create "${tag}" \
                --repo "${{ github.repository }}" \
                --title "${tag}" \
                --generate-notes \
                --target "${{ github.sha }}"
              echo "  ✔ created GitHub Release ${tag}"
            fi

            # 3. Dispatch publish workflow against the freshly-created tag
            gh workflow run "${workflow}" \
              --ref "${tag}" \
              --repo "${{ github.repository }}"
            echo "  ✔ dispatched ${workflow} @ ${tag}"

            DISPATCHED=true
          }

          handle_package "tonin"       "$TONIN_VER" "v${TONIN_VER}"             "release.yml"
          handle_package "tonin-sdk"   "$SDK_VER"   "tonin-sdk-v${SDK_VER}"     "release-tonin-sdk.yml"
          handle_package "tonin-proxy" "$PROXY_VER" "tonin-proxy-v${PROXY_VER}" "release-tonin-proxy.yml"

          if [ "$DISPATCHED" = "false" ]; then
            echo "::notice::No new tags — every package version is already released. Nothing dispatched."
          fi
