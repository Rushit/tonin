name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-flight runs for the same branch + workflow when a new push lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt + clippy + test + doc (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.90 is the declared MSRV (workspace.package.rust-version).
        # `stable` catches regressions on the latest toolchain.
        rust: ["1.90", "stable"]
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (${{ matrix.rust }})
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      # `etcd-client` (a transitive dep of `tonin-config-etcd`) has a
      # build.rs that compiles bundled .proto files via `prost-build`,
      # which requires `protoc` on PATH. Ubuntu/macOS/Windows runners
      # don't ship it preinstalled. arduino/setup-protoc handles all 3.
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "25.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          # Keep separate caches per toolchain so stable + MSRV don't stomp each other.
          key: ${{ matrix.rust }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: cargo fmt --check
        run: make fmt-check

      - name: cargo clippy
        run: make lint

      - name: cargo test
        run: make test

      - name: cargo doc (deny broken intra-doc links)
        run: make doc

  version-sync:
    name: VERSION file matches Cargo.toml [workspace.package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check VERSION == Cargo.toml [workspace.package].version
        run: |
          set -euo pipefail
          FILE_VERSION=$(tr -d '[:space:]' < VERSION)
          CARGO_VERSION=$(awk '
            /^\[workspace\.package\]/ { in_section=1; next }
            /^\[/ && in_section        { in_section=0 }
            in_section && /^version[[:space:]]*=/ {
              match($0, /"[^"]+"/)
              print substr($0, RSTART+1, RLENGTH-2)
              exit
            }
          ' Cargo.toml)
          echo "VERSION file : ${FILE_VERSION}"
          echo "Cargo.toml   : ${CARGO_VERSION}"
          if [ "${FILE_VERSION}" != "${CARGO_VERSION}" ]; then
            echo "::error::VERSION (${FILE_VERSION}) and Cargo.toml (${CARGO_VERSION}) are out of sync."
            echo "::error::Run  scripts/bump-version.sh ${CARGO_VERSION}  to fix both at once, or update VERSION manually."
            exit 1
          fi

  version-sync-sdk:
    name: tonin-sdk VERSION matches Cargo.toml [package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check crates/tonin-sdk/VERSION == Cargo.toml [package].version
        run: |
          set -euo pipefail
          FILE_VERSION=$(tr -d '[:space:]' < crates/tonin-sdk/VERSION)
          CARGO_VERSION=$(awk '
            /^\[package\]/ { in_section=1; next }
            /^\[/ && in_section { in_section=0 }
            in_section && /^version[[:space:]]*=/ {
              match($0, /"[^"]+"/)
              print substr($0, RSTART+1, RLENGTH-2)
              exit
            }
          ' crates/tonin-sdk/Cargo.toml)
          echo "VERSION file : ${FILE_VERSION}"
          echo "Cargo.toml   : ${CARGO_VERSION}"
          if [ "${FILE_VERSION}" != "${CARGO_VERSION}" ]; then
            echo "::error::crates/tonin-sdk/VERSION (${FILE_VERSION}) and crates/tonin-sdk/Cargo.toml (${CARGO_VERSION}) are out of sync."
            echo "::error::Run  crates/tonin-sdk/scripts/bump-version.sh ${CARGO_VERSION}  to fix both at once."
            exit 1
          fi

  version-sync-proxy:
    name: tonin-proxy VERSION matches Cargo.toml [package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check crates/tonin-proxy/VERSION == Cargo.toml [package].version
        run: |
          set -euo pipefail
          FILE_VERSION=$(tr -d '[:space:]' < crates/tonin-proxy/VERSION)
          CARGO_VERSION=$(awk '
            /^\[package\]/ { in_section=1; next }
            /^\[/ && in_section { in_section=0 }
            in_section && /^version[[:space:]]*=/ {
              match($0, /"[^"]+"/)
              print substr($0, RSTART+1, RLENGTH-2)
              exit
            }
          ' crates/tonin-proxy/Cargo.toml)
          echo "VERSION file : ${FILE_VERSION}"
          echo "Cargo.toml   : ${CARGO_VERSION}"
          if [ "${FILE_VERSION}" != "${CARGO_VERSION}" ]; then
            echo "::error::crates/tonin-proxy/VERSION (${FILE_VERSION}) and crates/tonin-proxy/Cargo.toml (${CARGO_VERSION}) are out of sync."
            echo "::error::Run  crates/tonin-proxy/scripts/bump-version.sh ${CARGO_VERSION}  to fix both at once."
            exit 1
          fi


  # ---------------------------------------------------------------------------
  # tonin-proxy smoke test
  #
  # Builds tonin-proxy (glibc, proxy-release profile) and verifies a full
  # gRPC round-trip through the proxy to a Python gRPC health server.
  # ---------------------------------------------------------------------------
  proxy-compat:
    name: tonin-proxy backward-compat smoke test
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.90 (MSRV)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90"

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "25.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: proxy-compat

      - name: Build tonin-proxy (proxy-release, glibc)
        run: cargo build --profile proxy-release -p tonin-proxy

      - name: Install grpcurl
        run: |
          curl -sSL https://github.com/fullstorydev/grpcurl/releases/download/v1.9.1/grpcurl_1.9.1_linux_x86_64.tar.gz \
            | tar -xz -C /usr/local/bin grpcurl

      - name: Start grpc-health test server
        run: |
          # Use a simple Python gRPC health server as the upstream.
          pip install grpcio grpcio-health-checking --quiet
          python3 - <<'EOF' &
          import grpc
          from concurrent import futures
          from grpc_health.v1 import health, health_pb2_grpc
          server = grpc.server(futures.ThreadPoolExecutor())
          health_pb2_grpc.add_HealthServicer_to_server(health.HealthServicer(), server)
          server.add_insecure_port('[::]:50051')
          server.start()
          server.wait_for_termination()
          EOF
          # Poll until port 50051 is open (up to 15s) instead of a fixed sleep.
          for i in $(seq 1 15); do
            nc -z localhost 50051 2>/dev/null && break
            sleep 1
          done
        shell: bash

      - name: Start tonin-proxy (source-built)
        run: |
          TONIN_PROXY_UPSTREAM=http://localhost:50051 \
          TONIN_PROXY_PORT=6565 \
          TONIN_PROXY_LOG=info \
            ./target/proxy-release/tonin-proxy &
          PROXY_PID=$!
          # Poll until port 6565 is open (up to 15s) instead of a fixed sleep.
          for i in $(seq 1 15); do
            nc -z localhost 6565 2>/dev/null && break
            kill -0 "$PROXY_PID" 2>/dev/null || { echo "::error::tonin-proxy exited early"; exit 1; }
            sleep 1
          done
        shell: bash

      - name: Verify proxy round-trip (Health/Check)
        run: |
          # Download the standard health.proto to bypass reflection, which is a
          # bidirectional stream that deadlocks against proxy buffering.
          curl -sSL https://raw.githubusercontent.com/grpc/grpc/master/src/proto/grpc/health/v1/health.proto -o health.proto
          # timeout 30 guards against the proxy accepting the connection but
          # stalling on the upstream forward (would otherwise hang indefinitely).
          timeout 30 grpcurl -plaintext -connect-timeout 10 \
            -proto health.proto \
            -d '{"service":""}' localhost:6565 grpc.health.v1.Health/Check

      - name: Pull and smoke-test published latest image
        # Allowed to fail if the image doesn't exist yet (first release).
        continue-on-error: true
        run: |
          docker pull ghcr.io/rushit/tonin-proxy:latest 2>/dev/null || \
            { echo "::notice::ghcr.io/rushit/tonin-proxy:latest not yet published — skipping image smoke test"; exit 0; }
          # Verify the binary inside the image starts and exits cleanly with bad config.
          # We omit TONIN_PROXY_UPSTREAM so both the old and new image exit immediately
          # instead of hanging in the accept loop, and use timeout as a safeguard.
          timeout 15 docker run --rm \
            ghcr.io/rushit/tonin-proxy:latest 2>&1 | grep -q "TONIN_PROXY_UPSTREAM" \
            && echo "published image starts correctly (missing upstream detected)" \
            || echo "::warning::published image did not emit expected startup error"

