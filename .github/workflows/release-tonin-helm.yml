# Release tonin-helm to crates.io + cross-platform binaries
#
# Triggered by pushing a tonin-helm-vX.Y.Z tag (via `make release-helm VERSION=X.Y.Z`
# or automatically by auto-tag.yml when a version bump is merged into main).
#
# Jobs:
#   verify         — tag matches crates/tonin-helm/Cargo.toml [package].version
#   test           — cargo test -p tonin-helm
#   create-release — draft GitHub Release
#   build-binaries — cross-platform tonin-helm binaries
#   publish-crate  — cargo publish -p tonin-helm to crates.io
#   finalize-release — flip draft → published
#   verify-install — smoke-test install.sh --with-tonin-helm
#
# Required secrets:
#   GITHUB_TOKEN         — auto-provided
#   CARGO_REGISTRY_TOKEN — crates.io API token

name: Release tonin-helm

on:
  push:
    tags:
      - 'tonin-helm-v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g. tonin-helm-v0.3.4) — emergency manual run only'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Verify the tag matches crates/tonin-helm/Cargo.toml [package].version.
  # ---------------------------------------------------------------------------
  verify:
    name: Verify tag matches crates/tonin-helm/Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REF="${{ github.event.inputs.version }}"
          else
            REF="${{ github.ref_name }}"
          fi
          # Strip "tonin-helm-v" prefix to get bare X.Y.Z
          TAG_VERSION="${REF#tonin-helm-v}"
          CARGO_VERSION=$(awk '
            /^\[package\]/ { in_section=1; next }
            /^\[/ && in_section { in_section=0 }
            in_section && /^version[[:space:]]*=/ {
              match($0, /"[^"]+"/)
              print substr($0, RSTART+1, RLENGTH-2)
              exit
            }
          ' crates/tonin-helm/Cargo.toml)
          echo "Tag version:         ${TAG_VERSION}"
          echo "Cargo.toml version:  ${CARGO_VERSION}"
          if [ "${TAG_VERSION}" != "${CARGO_VERSION}" ]; then
            echo "::error::Tag ${REF} does not match crates/tonin-helm/Cargo.toml version (${CARGO_VERSION})." >&2
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Full test suite for tonin-helm.
  # ---------------------------------------------------------------------------
  test:
    name: Test tonin-helm
    needs: verify
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.90
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90"
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: fmt + clippy + test + doc
        run: |
          cargo fmt -p tonin-helm -- --check
          cargo clippy -p tonin-helm --all-targets -- -D warnings
          cargo test -p tonin-helm
          RUSTDOCFLAGS="-D warnings" cargo doc -p tonin-helm --no-deps

  # ---------------------------------------------------------------------------
  # Draft GitHub Release.
  # ---------------------------------------------------------------------------
  create-release:
    name: Create draft Release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          draft: true
          prerelease: false

  # ---------------------------------------------------------------------------
  # Cross-platform binary builds.
  # ---------------------------------------------------------------------------
  build-binaries:
    name: Build ${{ matrix.target }}
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.90 + target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90"
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Resolve tag name
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and upload tonin-helm
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: tonin-helm
          target: ${{ matrix.target }}
          archive: tonin-helm-$target
          tar: unix
          zip: windows
          checksum: sha256
          ref: ${{ steps.tag.outputs.name }}
          token: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Publish to crates.io.
  # ---------------------------------------------------------------------------
  publish-crate:
    name: Publish tonin-helm to crates.io
    needs: test
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.90
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo publish -p tonin-helm
        run: cargo publish -p tonin-helm

  # ---------------------------------------------------------------------------
  # Finalize: flip draft Release to published.
  # ---------------------------------------------------------------------------
  finalize-release:
    name: Finalize GitHub Release
    needs: [publish-crate, build-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          draft: false
          prerelease: false

  # ---------------------------------------------------------------------------
  # Smoke-test: install via install.sh and assert the version matches.
  # ---------------------------------------------------------------------------
  verify-install:
    name: Smoke-test install.sh --with-tonin-helm
    needs: finalize-release
    runs-on: ubuntu-latest
    steps:
      - name: Install and assert version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REF="${{ github.event.inputs.version }}"
          else
            REF="${{ github.ref_name }}"
          fi
          WANT="${REF#tonin-helm-v}"
          DEST="$(mktemp -d)"
          curl -sSfL https://raw.githubusercontent.com/Rushit/tonin/main/scripts/install.sh \
            | bash -s -- --dir "$DEST" --with-tonin-helm
          GOT="$("$DEST/tonin-helm" --version | awk '{print $NF}')"
          echo "install.sh installed tonin-helm ${GOT} (expected ${WANT})"
          if [ "${GOT}" != "${WANT}" ]; then
            echo "::error::install.sh installed tonin-helm ${GOT} but the released tag is ${WANT}" >&2
            exit 1
          fi
