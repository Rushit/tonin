name: Validate Dockerfiles

# Trigger on push to main and release branches (after PR testing passes).
# Does not run on PRs since CI workflow already validates.
# Actual artifact publishing is handled by release.yml:
#   - tonin-proxy Docker image → ghcr.io (release.yml)
#   - tonin CLI binaries → GitHub releases (release.yml)
#   - tonin-sdk crate → crates.io (release.yml)
on:
  push:
    branches: [main, release/*]
  workflow_dispatch:

permissions:
  packages: write  # needed for Docker Buildx cache
  contents: read

# Cancel in-flight runs for the same branch + workflow when a new push lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Validate that all Dockerfiles build without errors.
  # This catches build regressions on every merge to main.
  # Actual publishing to ghcr.io/crates.io happens in release.yml.
  validate-dockerfiles:
    name: Validate Dockerfiles build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate tonin-proxy Dockerfile
        uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/tonin-proxy/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log validation success
        run: echo "✓ All Dockerfiles validated successfully"
