# Release tonin-sdk to crates.io (library-only — no binary builds)
#
# Triggered by pushing a tonin-sdk-vX.Y.Z tag (via `make release-sdk VERSION=X.Y.Z`
# or automatically by auto-tag.yml when a version bump is merged into main).
#
# Jobs:
#   verify         — tag matches crates/tonin-sdk/Cargo.toml [package].version
#   test           — cargo test -p tonin-sdk
#   publish-crate  — cargo publish -p tonin-sdk to crates.io
#   finalize-release — create/publish GitHub Release
#
# Required secrets:
#   GITHUB_TOKEN         — auto-provided
#   CARGO_REGISTRY_TOKEN — crates.io API token

name: Release tonin-sdk

on:
  push:
    tags:
      - 'tonin-sdk-v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Override version tag (e.g. tonin-sdk-v0.8.0). Leave blank to use the ref this run targets.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Verify the tag matches crates/tonin-sdk/Cargo.toml [package].version.
  # ---------------------------------------------------------------------------
  verify:
    name: Verify tag matches crates/tonin-sdk/Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify
        run: |
          set -euo pipefail
          REF="${{ github.event.inputs.version || github.ref_name }}"
          TAG_VERSION="${REF#tonin-sdk-v}"
          CARGO_VERSION=$(awk '
            /^\[package\]/ { in_section=1; next }
            /^\[/ && in_section { in_section=0 }
            in_section && /^version[[:space:]]*=/ {
              match($0, /"[^"]+"/)
              print substr($0, RSTART+1, RLENGTH-2)
              exit
            }
          ' crates/tonin-sdk/Cargo.toml)
          FILE_VERSION=$(tr -d '[:space:]' < crates/tonin-sdk/VERSION)
          echo "Tag version:         ${TAG_VERSION}"
          echo "Cargo.toml version:  ${CARGO_VERSION}"
          echo "VERSION file:        ${FILE_VERSION}"
          if [ "${FILE_VERSION}" != "${CARGO_VERSION}" ]; then
            echo "::error::crates/tonin-sdk/VERSION (${FILE_VERSION}) and Cargo.toml (${CARGO_VERSION}) are out of sync." >&2
            echo "::error::Run crates/tonin-sdk/scripts/bump-version.sh ${CARGO_VERSION} to resync." >&2
            exit 1
          fi
          if [ "${TAG_VERSION}" != "${CARGO_VERSION}" ]; then
            echo "::error::Tag ${REF} does not match crates/tonin-sdk/Cargo.toml version (${CARGO_VERSION})." >&2
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Full test suite for tonin-sdk.
  # ---------------------------------------------------------------------------
  test:
    name: Test tonin-sdk
    needs: verify
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.90
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90"
          components: rustfmt, clippy

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "25.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: fmt + clippy + test + doc
        run: |
          cargo fmt -p tonin-sdk -- --check
          cargo clippy -p tonin-sdk --all-targets -- -D warnings
          cargo test -p tonin-sdk
          RUSTDOCFLAGS="-D warnings" cargo doc -p tonin-sdk --no-deps

  # ---------------------------------------------------------------------------
  # Publish to crates.io (leaf deps first, then tonin-sdk).
  # ---------------------------------------------------------------------------
  publish-crate:
    name: Publish tonin-sdk to crates.io
    needs: test
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.90
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90"

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "25.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Publish leaf deps then tonin-sdk
        run: |
          set -euo pipefail
          echo "Publishing tonin-client..."
          cargo publish -p tonin-client
          sleep 30
          echo "Publishing tonin-mcp-macros..."
          cargo publish -p tonin-mcp-macros
          sleep 30
          echo "Publishing tonin-sdk..."
          cargo publish -p tonin-sdk

  # ---------------------------------------------------------------------------
  # Create/publish GitHub Release.
  # ---------------------------------------------------------------------------
  finalize-release:
    name: Finalize GitHub Release
    needs: publish-crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag name
        id: tag
        run: |
          echo "name=${{ github.event.inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          draft: false
          prerelease: false
