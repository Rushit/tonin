# Smart auto-release on merge to main
#
# Detects which packages changed, bumps only those packages' version
# (reading the current version from the VERSION file), commits the bump,
# pushes a tag, and triggers the corresponding release workflow explicitly
# via `gh workflow run` — so no RELEASE_PAT secret is needed.
#
# Rules:
#   • fix: commits (patch changes)     → PATCH bump (e.g. 0.7.0 → 0.7.1)
#   • feat: commits (new features)     → MINOR bump (e.g. 0.7.0 → 0.8.0)
#   • feat!: / BREAKING CHANGE:        → MAJOR bump (e.g. 0.7.0 → 1.0.0)
#   • No Conventional Commit match     → PATCH bump (safe default)
#   • Changes under crates/tonin-sdk/  → independent tonin-sdk release
#   • Changes anywhere else in repo    → workspace tonin release
#   • Multiple packages can fire in parallel in the same merge
#   • MAJOR version bumps can also be done manually (`make release BUMP=major`)
#   • VERSION-sync and [skip ci] commits are ignored (no loop)
#   • Version sync is verified before each bump; auto-corrected if needed
#
# No secrets required beyond the auto-provided GITHUB_TOKEN.

name: Auto-release on merge

on:
  push:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # Detect which packages have file changes in this push.
  # ---------------------------------------------------------------------------
  detect-changes:
    name: Detect changed packages
    runs-on: ubuntu-latest
    outputs:
      tonin: ${{ steps.diff.outputs.tonin }}
      tonin_sdk: ${{ steps.diff.outputs.tonin_sdk }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Compute per-package change flags
        id: diff
        run: |
          set -euo pipefail

          # Skip VERSION-sync / [skip ci] commits produced by this workflow.
          COMMIT_MSG=$(git log -1 --pretty=%s)
          if echo "$COMMIT_MSG" | grep -qE '\[skip ci\]|chore: (bump|sync|release)'; then
            echo "Skipping housekeeping commit."
            echo "tonin=false"     >> "$GITHUB_OUTPUT"
            echo "tonin_sdk=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          echo "Changed files:"
          echo "$CHANGED"

          # tonin-sdk: only crates/tonin-sdk/
          if echo "$CHANGED" | grep -q '^crates/tonin-sdk/'; then
            echo "tonin_sdk=true" >> "$GITHUB_OUTPUT"
          else
            echo "tonin_sdk=false" >> "$GITHUB_OUTPUT"
          fi

          # tonin workspace: anything outside crates/tonin-sdk/
          if echo "$CHANGED" | grep -qvE '^crates/tonin-sdk/'; then
            echo "tonin=true" >> "$GITHUB_OUTPUT"
          else
            echo "tonin=false" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # Bump tonin workspace + commit + tag + trigger release.yml
  # ---------------------------------------------------------------------------
  release-tonin:
    name: Bump & release tonin
    needs: detect-changes
    if: needs.detect-changes.outputs.tonin == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push commit + tag
      actions: write    # gh workflow run

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90"

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version, commit, tag, trigger release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Verify VERSION file and Cargo.toml are in sync; auto-fix if not.
          FILE_VER=$(tr -d '[:space:]' < VERSION)
          CARGO_VER=$(awk '
            /^\[workspace\.package\]/ { s=1; next }
            /^\[/ && s { s=0 }
            s && /^version[[:space:]]*=/ { match($0, /"[^"]+"/) ; print substr($0, RSTART+1, RLENGTH-2) ; exit }
          ' Cargo.toml)
          if [ "${FILE_VER}" != "${CARGO_VER}" ]; then
            echo "VERSION (${FILE_VER}) and Cargo.toml (${CARGO_VER}) are out of sync — auto-fixing to ${CARGO_VER}..."
            ./scripts/bump-version.sh "${CARGO_VER}"
            git push origin main
            FILE_VER="${CARGO_VER}"
          fi

          # Determine bump type from Conventional Commits since last release tag.
          # Path filter excludes tonin-sdk changes (which have their own release cycle).
          LAST_TAG=$(git describe --tags --match "v*.*.*" --abbrev=0 2>/dev/null || echo "")
          echo "Last tonin tag: ${LAST_TAG:-none}"
          if [ -n "$LAST_TAG" ]; then
            COMMITS=$(git log "${LAST_TAG}..HEAD" --pretty=format:"%s%n%b" -- ':!crates/tonin-sdk/' 2>/dev/null || true)
          else
            COMMITS=$(git log --pretty=format:"%s%n%b" -- ':!crates/tonin-sdk/' 2>/dev/null || true)
          fi

          BUMP="patch"
          if echo "$COMMITS" | grep -qE '^[a-z]+(\([^)]+\))?!:' || \
             echo "$COMMITS" | grep -q 'BREAKING CHANGE:'; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qE '^feat(\([^)]+\))?:'; then
            BUMP="minor"
          fi
          echo "Conventional Commits bump type: ${BUMP}"

          # Calculate new version.
          CURRENT=$(tr -d '[:space:]' < VERSION)
          MAJOR="${CURRENT%%.*}"
          REST="${CURRENT#*.}"
          MINOR="${REST%%.*}"
          PATCH="${REST#*.}"
          case "$BUMP" in
            major) NEW_VERSION="$((MAJOR + 1)).0.0" ;;
            minor) NEW_VERSION="${MAJOR}.$((MINOR + 1)).0" ;;
            patch) NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
          esac
          TAG="v${NEW_VERSION}"

          # Idempotency: if tag exists, a manual bump already happened.
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "${TAG}"; then
            echo "Tag ${TAG} already exists — nothing to do."
            exit 0
          fi

          echo "Bumping ${CURRENT} → ${NEW_VERSION}"
          ./scripts/bump-version.sh "${NEW_VERSION}"

          # bump-version.sh already commits and locks Cargo.lock.
          # Push the bump commit to main, then push the tag.
          git push origin main
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"

          # Explicitly trigger release.yml on this tag (GITHUB_TOKEN push
          # does not auto-fire push-triggered workflows, so we dispatch it).
          gh workflow run release.yml --ref "${TAG}"
          echo "Triggered release.yml for ${TAG}."

  # ---------------------------------------------------------------------------
  # Bump tonin-sdk + commit + tag + trigger release-tonin-sdk.yml
  # ---------------------------------------------------------------------------
  release-tonin-sdk:
    name: Bump & release tonin-sdk
    needs: detect-changes
    if: needs.detect-changes.outputs.tonin_sdk == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90"

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "25.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump tonin-sdk version, commit, tag, trigger release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Verify tonin-sdk VERSION file and Cargo.toml are in sync; auto-fix if not.
          SDK_FILE=$(tr -d '[:space:]' < crates/tonin-sdk/VERSION)
          SDK_CARGO=$(awk '
            /^\[package\]/ { s=1; next }
            /^\[/ && s { s=0 }
            s && /^version[[:space:]]*=/ { match($0, /"[^"]+"/) ; print substr($0, RSTART+1, RLENGTH-2) ; exit }
          ' crates/tonin-sdk/Cargo.toml)
          if [ "${SDK_FILE}" != "${SDK_CARGO}" ]; then
            echo "tonin-sdk VERSION (${SDK_FILE}) and Cargo.toml (${SDK_CARGO}) are out of sync — auto-fixing to ${SDK_CARGO}..."
            ./crates/tonin-sdk/scripts/bump-version.sh "${SDK_CARGO}"
            git push origin main
          fi

          # Determine bump type from Conventional Commits since last sdk release tag.
          LAST_TAG=$(git describe --tags --match "tonin-sdk-v*.*.*" --abbrev=0 2>/dev/null || echo "")
          echo "Last tonin-sdk tag: ${LAST_TAG:-none}"
          if [ -n "$LAST_TAG" ]; then
            COMMITS=$(git log "${LAST_TAG}..HEAD" --pretty=format:"%s%n%b" -- crates/tonin-sdk/ 2>/dev/null || true)
          else
            COMMITS=$(git log --pretty=format:"%s%n%b" -- crates/tonin-sdk/ 2>/dev/null || true)
          fi

          BUMP="patch"
          if echo "$COMMITS" | grep -qE '^[a-z]+(\([^)]+\))?!:' || \
             echo "$COMMITS" | grep -q 'BREAKING CHANGE:'; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qE '^feat(\([^)]+\))?:'; then
            BUMP="minor"
          fi
          echo "Conventional Commits bump type: ${BUMP}"

          # Calculate new version.
          CURRENT=$(tr -d '[:space:]' < crates/tonin-sdk/VERSION)
          MAJOR="${CURRENT%%.*}"
          REST="${CURRENT#*.}"
          MINOR="${REST%%.*}"
          PATCH="${REST#*.}"
          case "$BUMP" in
            major) NEW_VERSION="$((MAJOR + 1)).0.0" ;;
            minor) NEW_VERSION="${MAJOR}.$((MINOR + 1)).0" ;;
            patch) NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
          esac
          TAG="tonin-sdk-v${NEW_VERSION}"

          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "${TAG}"; then
            echo "Tag ${TAG} already exists — nothing to do."
            exit 0
          fi

          echo "Bumping tonin-sdk ${CURRENT} → ${NEW_VERSION}"
          ./crates/tonin-sdk/scripts/bump-version.sh "${NEW_VERSION}"

          git push origin main
          git tag -a "${TAG}" -m "Release tonin-sdk ${TAG}"
          git push origin "${TAG}"

          gh workflow run release-tonin-sdk.yml --ref "${TAG}"
          echo "Triggered release-tonin-sdk.yml for ${TAG}."
