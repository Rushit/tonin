name: Release tonin-proxy

on:
  push:
    tags:
      - 'tonin-proxy-v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Override version tag (e.g. tonin-proxy-v0.8.0). Leave blank to use the ref this run targets.'
        required: false
        type: string

permissions:
  contents: write
  packages: write   # needed to push to ghcr.io

jobs:
  # ---------------------------------------------------------------------------
  # Verify the tag matches crates/tonin-proxy/Cargo.toml [package].version.
  # ---------------------------------------------------------------------------
  verify:
    name: Verify tag matches crates/tonin-proxy/Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify
        run: |
          set -euo pipefail
          REF="${{ github.event.inputs.version || github.ref_name }}"
          TAG_VERSION="${REF#tonin-proxy-v}"
          CARGO_VERSION=$(awk '
            /^\[package\]/ { in_section=1; next }
            /^\[/ && in_section { in_section=0 }
            in_section && /^version[[:space:]]*=/ {
              match($0, /"[^"]+"/)
              print substr($0, RSTART+1, RLENGTH-2)
              exit
            }
          ' crates/tonin-proxy/Cargo.toml)
          FILE_VERSION=$(awk '{print $1}' crates/tonin-proxy/VERSION)
          echo "Tag version:         ${TAG_VERSION}"
          echo "Cargo.toml version:  ${CARGO_VERSION}"
          echo "VERSION file:        ${FILE_VERSION}"
          if [ "${FILE_VERSION}" != "${CARGO_VERSION}" ]; then
            echo "::error::crates/tonin-proxy/VERSION (${FILE_VERSION}) and Cargo.toml (${CARGO_VERSION}) are out of sync." >&2
            echo "::error::Run crates/tonin-proxy/scripts/bump-version.sh ${CARGO_VERSION} to resync." >&2
            exit 1
          fi
          if [ "${TAG_VERSION}" != "${CARGO_VERSION}" ]; then
            echo "::error::Tag ${REF} does not match crates/tonin-proxy/Cargo.toml version (${CARGO_VERSION})." >&2
            exit 1
          fi

  # ----------------------------------------------------------------------
  # Cross-platform binary builds. Each matrix entry produces one archive
  # and uploads it to the GitHub Release created by release-please.
  # ----------------------------------------------------------------------
  build-binaries:
    name: Build ${{ matrix.target }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-15-intel
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-14
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.90 with target ${{ matrix.target }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          targets: ${{ matrix.target }}

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "25.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build and upload tonin-proxy
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: tonin-proxy
          target: ${{ matrix.target }}
          archive: tonin-proxy-$target
          tar: unix
          zip: windows
          checksum: sha256
          include: LICENSE,README.md
          ref: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

  # ----------------------------------------------------------------------
  # Build and push the tonin-proxy Docker image to ghcr.io.
  # ----------------------------------------------------------------------
  publish-docker:
    name: Publish tonin-proxy Docker image
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "25.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version tag
        id: ver
        run: |
          REF="${{ github.event.inputs.version || github.ref_name }}"
          echo "version=${REF#tonin-proxy-v}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/tonin-proxy/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/rushit/tonin-proxy:${{ steps.ver.outputs.version }}
            ghcr.io/rushit/tonin-proxy:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
