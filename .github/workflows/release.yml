# Setup:
#   CARGO_REGISTRY_TOKEN — crates.io API token (Settings → Secrets → Actions)
#   Docker images are pushed to ghcr.io using the built-in GITHUB_TOKEN; no
#   extra secret is required:
#     ghcr.io/rushit/tonin-proxy:<version>   (versioned tag)
#     ghcr.io/rushit/tonin-proxy:latest      (floating tag, updated each release)
#
# crates.io publish order (must respect the internal dep graph):
#   1. tonin-client      - leaf, no internal deps
#   2. tonin-mcp-macros  - leaf, no internal deps
#   3. tonin-build       - leaf, no internal deps
#   4. tonin-plugin      - leaf, no internal deps
#   5. tonin-sdk         - depends on tonin-client + tonin-mcp-macros
#   6. tonin             - CLI binary, depends on tonin-plugin (published last)
#
# A short sleep between publishes gives the crates.io sparse index time to
# propagate; without it, the next `cargo publish` can fail to resolve the
# crate it just uploaded.
#
# Binary targets (CLI `tonin` and `tonin-proxy`, built per release):
#   - x86_64-unknown-linux-gnu   (Linux x86_64)
#   - aarch64-unknown-linux-gnu  (Linux ARM64, e.g. Graviton)
#   - x86_64-apple-darwin        (macOS Intel)
#   - aarch64-apple-darwin       (macOS Apple Silicon)
#   - x86_64-pc-windows-msvc     (Windows x86_64)
#
# Archives follow taiki-e/upload-rust-binary-action's default naming:
#   tonin-<target>.tar.gz / tonin-proxy-<target>.tar.gz  (.zip on Windows)
# That naming is also what `cargo binstall tonin` expects, so end users
# get pre-built binaries for free without us shipping a separate installer.

name: Release

# Single unified publisher for ALL release artifacts off one v*.*.* tag:
#   1. tonin CLI         — crates.io (`tonin`) + cross-platform binaries
#   2. tonin SDK (Rust)  — crates.io (`tonin-sdk` + leaf crates)
#   3. tonin-proxy       — cross-platform binaries + ghcr.io Docker image
#   4. tonin-client (TS) — npm (independent version); skipped if NPM_TOKEN unset
#   (future: tonin-sdk-py — PyPI/pip; add a publish-pypi job here when it lands)
#
# Dispatched by auto-release.yml via workflow_dispatch with --ref v<version>.
# auto-release creates the tag + GitHub Release first; this workflow attaches
# all crates/binaries/images to that single release. Also runnable by hand for
# re-runs or hotfixes (every job is idempotent — already-published artifacts are
# skipped).
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to publish (e.g. v0.1.0). Leave blank to use the ref this run targets.'
        required: false
        type: string

permissions:
  contents: write
  packages: write   # needed to push to ghcr.io

jobs:
  # ----------------------------------------------------------------------
  # Verify tag matches the workspace version before doing anything.
  # Both publish-crates and build-binaries depend on this passing.
  # ----------------------------------------------------------------------
  verify:
    name: Verify tag matches workspace version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify
        run: |
          set -euo pipefail
          REF="${{ github.event.inputs.version || github.ref_name }}"
          TAG_VERSION="${REF#v}"
          # /VERSION is the source of truth. scripts/bump-version.sh keeps
          # Cargo.toml's [workspace.package].version in sync; we still cross-
          # check it here to catch the case where someone hand-edited one
          # without the other.
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          CARGO_VERSION="$(
            awk '
              /^\[workspace\.package\]/ { in_section=1; next }
              /^\[/ && in_section      { in_section=0 }
              in_section && /^version[[:space:]]*=/ {
                match($0, /"[^"]+"/)
                print substr($0, RSTART+1, RLENGTH-2)
                exit
              }
            ' Cargo.toml
          )"
          echo "Tag version:       ${TAG_VERSION}"
          echo "VERSION file:      ${FILE_VERSION}"
          echo "Cargo.toml:        ${CARGO_VERSION}"
          if [ "${FILE_VERSION}" != "${CARGO_VERSION}" ]; then
            echo "::error::VERSION (${FILE_VERSION}) and Cargo.toml (${CARGO_VERSION}) are out of sync." >&2
            echo "::error::Run scripts/bump-version.sh to resync, then re-tag." >&2
            exit 1
          fi
          if [ "${TAG_VERSION}" != "${FILE_VERSION}" ]; then
            echo "::error::Tag ${REF} does not match /VERSION (${FILE_VERSION})." >&2
            exit 1
          fi

  # ----------------------------------------------------------------------
  # Publish all six crates to crates.io in dep order.
  # `cargo update --workspace` runs first to bring Cargo.lock in sync with
  # the version bump committed by auto-release (avoids stale-lock errors
  # during `cargo publish`'s internal verification step).
  # ----------------------------------------------------------------------
  publish-crates:
    name: Publish crates to crates.io
    needs: verify
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    outputs:
      skipped: ${{ steps.check.outputs.skipped }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check if all crates already published
        id: check
        run: |
          set -euo pipefail
          REF="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${REF#v}"
          CRATES=(tonin-client tonin-mcp-macros tonin-build tonin-plugin tonin-sdk tonin)
          ALL_PUBLISHED=true
          for crate in "${CRATES[@]}"; do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" \
              -H "User-Agent: tonin-ci (github.com/${{ github.repository }})" \
              "https://crates.io/api/v1/crates/${crate}/${VERSION}" || true)
            if [ "$STATUS" != "200" ]; then
              ALL_PUBLISHED=false
              echo "${crate}@${VERSION}: not yet on crates.io (HTTP ${STATUS})"
            else
              echo "${crate}@${VERSION}: already on crates.io — will skip if all published"
            fi
          done
          if $ALL_PUBLISHED; then
            echo "::notice::All crates already published at ${VERSION} — skipping publish step."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust 1.93
        if: steps.check.outputs.skipped != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0

      - name: Install protoc
        if: steps.check.outputs.skipped != 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: protoc@3.25.5

      - name: Cache cargo
        if: steps.check.outputs.skipped != 'true'
        uses: Swatinem/rust-cache@v2

      - name: Sync Cargo.lock with bumped version
        if: steps.check.outputs.skipped != 'true'
        run: cargo update --workspace

      - name: Publish all crates to crates.io
        if: steps.check.outputs.skipped != 'true'
        run: make publish

  # ----------------------------------------------------------------------
  # Cross-platform CLI binary builds. Each matrix entry produces one archive
  # and uploads it to the GitHub Release created by auto-release.
  # ----------------------------------------------------------------------
  build-binaries:
    name: Build ${{ matrix.target }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            # macos-13 was removed by GitHub on 2025-12-08; macos-15-intel is the
            # native x86_64 image (available until ~Aug 2027). When Intel retires,
            # cross-compile this target on an Apple Silicon runner (os: macos-14).
            os: macos-15-intel
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-14
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check if binary asset already uploaded
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REF="${{ github.event.inputs.version || github.ref_name }}"
          EXT="${{ matrix.archive }}"
          ASSET="tonin-${{ matrix.target }}.${EXT}"
          if gh release view "$REF" --repo "${{ github.repository }}" \
               --json assets --jq ".assets[].name" 2>/dev/null \
             | grep -qxF "$ASSET"; then
            echo "::notice::Binary asset ${ASSET} already exists in release ${REF} — skipping build."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust 1.93 with target ${{ matrix.target }}
        if: steps.check.outputs.skipped != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          targets: ${{ matrix.target }}

      - name: Install protoc
        if: steps.check.outputs.skipped != 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: protoc@3.25.5

      - name: Cache cargo
        if: steps.check.outputs.skipped != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build and upload tonin
        if: steps.check.outputs.skipped != 'true'
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: tonin
          target: ${{ matrix.target }}
          archive: tonin-$target
          tar: unix
          zip: windows
          checksum: sha256
          include: LICENSE,README.md
          ref: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

  # ----------------------------------------------------------------------
  # tonin-proxy cross-platform binaries — uploaded to the SAME v* release
  # as the CLI (asset names are prefixed tonin-proxy- so they don't collide).
  # ----------------------------------------------------------------------
  build-proxy-binaries:
    name: Build proxy ${{ matrix.target }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-15-intel
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-14
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check if proxy binary asset already uploaded
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REF="${{ github.event.inputs.version || github.ref_name }}"
          EXT="${{ matrix.archive }}"
          ASSET="tonin-proxy-${{ matrix.target }}.${EXT}"
          if gh release view "$REF" --repo "${{ github.repository }}" \
               --json assets --jq ".assets[].name" 2>/dev/null \
             | grep -qxF "$ASSET"; then
            echo "::notice::Binary asset ${ASSET} already exists in release ${REF} — skipping build."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust 1.93 with target ${{ matrix.target }}
        if: steps.check.outputs.skipped != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          targets: ${{ matrix.target }}

      - name: Install protoc
        if: steps.check.outputs.skipped != 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: protoc@3.25.5

      - name: Cache cargo
        if: steps.check.outputs.skipped != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          key: proxy-${{ matrix.target }}

      - name: Build and upload tonin-proxy
        if: steps.check.outputs.skipped != 'true'
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: tonin-proxy
          target: ${{ matrix.target }}
          archive: tonin-proxy-$target
          tar: unix
          zip: windows
          checksum: sha256
          include: LICENSE,README.md
          ref: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

  # ----------------------------------------------------------------------
  # tonin-proxy multi-arch Docker image → ghcr.io.
  # ----------------------------------------------------------------------
  publish-proxy-docker:
    name: Publish tonin-proxy Docker image
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      skipped: ${{ steps.check.outputs.skipped }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve version
        id: ver
        run: |
          REF="${{ github.event.inputs.version || github.ref_name }}"
          echo "version=${REF#v}" >> "$GITHUB_OUTPUT"

      - name: Check if Docker image already published
        id: check
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/rushit/tonin-proxy:${{ steps.ver.outputs.version }}"
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "::notice::Docker image ${IMAGE} already exists on ghcr.io — skipping build and push."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install protoc
        if: steps.check.outputs.skipped != 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: protoc@3.25.5

      - name: Set up Docker Buildx
        if: steps.check.outputs.skipped != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: steps.check.outputs.skipped != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.check.outputs.skipped != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/tonin-proxy/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/rushit/tonin-proxy:${{ steps.ver.outputs.version }}
            ghcr.io/rushit/tonin-proxy:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}

  # ----------------------------------------------------------------------
  # Publish the tonin-client TypeScript package to npm.
  #
  # Independent version (ts/tonin-client/package.json), like the Python
  # client — not tied to the workspace v* tag. Skips cleanly when NPM_TOKEN
  # is not configured, and is idempotent (skips a version already on npm).
  # To enable: claim the `tonin-client` name on npm and add an NPM_TOKEN
  # repo secret (Settings → Secrets → Actions).
  # ----------------------------------------------------------------------
  publish-ts-client:
    name: Publish tonin-client (npm)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Gate on NPM_TOKEN presence
        id: gate
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_TOKEN}" ]; then
            echo "::notice::NPM_TOKEN not set — skipping npm publish of tonin-client."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.gate.outputs.publish == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: ts/tonin-client/package-lock.json

      - name: Install, typecheck, test, build
        if: steps.gate.outputs.publish == 'true'
        working-directory: ts/tonin-client
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Publish to npm (idempotent)
        if: steps.gate.outputs.publish == 'true'
        working-directory: ts/tonin-client
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          PKG="$(node -p "require('./package.json').name")"
          VER="$(node -p "require('./package.json').version")"
          if npm view "${PKG}@${VER}" version > /dev/null 2>&1; then
            echo "::notice::${PKG}@${VER} already on npm — skipping publish."
          else
            npm publish --access public
          fi

  # ----------------------------------------------------------------------
  # Smoke-test the installer end to end once all binary assets are uploaded.
  # Depends on finalize-release because `releases/latest` ignores draft
  # releases, so it only resolves to this tag once it's published.
  # ----------------------------------------------------------------------
  verify-install:
    name: Smoke-test install.sh
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install via install.sh and assert version
        run: |
          set -euo pipefail
          REF="${{ github.event.inputs.version || github.ref_name }}"
          WANT="${REF#v}"
          DEST="$(mktemp -d)"
          # Pass --version explicitly so install.sh skips the GitHub API
          # "latest release" lookup — that unauthenticated call returns 403
          # on shared Actions runners due to rate limiting.
          bash scripts/install.sh --dir "$DEST" --version "$REF"
          GOT="$("$DEST/tonin" --version | awk '{print $NF}')"
          echo "install.sh installed tonin ${GOT} (expected ${WANT})"
          if [ "${GOT}" != "${WANT}" ]; then
            echo "::error::install.sh installed ${GOT} but the released tag is ${WANT}" >&2
            exit 1
          fi
