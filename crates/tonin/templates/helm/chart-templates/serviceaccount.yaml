{{- /*
The service's own ServiceAccount, named after the service: its pods
(Deployment/StatefulSet, CronJobs) run as it, so service-to-service auth can
identify the caller as system:serviceaccount:<namespace>:<service>. No API
token is mounted unless serviceAccount.automountToken is set; projected,
audience-bound tokens are pod volumes (serviceAccount.tokenVolumes).
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "service.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
{{- if eq .Values.migrations.mode "job" }}
{{- /*
The migration Job is a pre-install/pre-upgrade hook: on a first install it
runs before the regular resources above exist. It gets its own hook
ServiceAccount, created before the Job (lower weight) and deleted with it,
so the Job never waits for, or shares, the service's identity.
*/}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "service.name" . }}-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
automountServiceAccountToken: false
{{- end }}
