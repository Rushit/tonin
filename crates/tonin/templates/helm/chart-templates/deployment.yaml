{{- /*
The service's workload: a Deployment, or a StatefulSet for [deploy] kind =
"statefulset" (headless Service in service.yaml, one PVC per pod per `pvc`
volume). Both share this pod template.
*/}}
{{- $sts := eq .Values.workload.kind "StatefulSet" }}
apiVersion: apps/v1
kind: {{ ternary "StatefulSet" "Deployment" $sts }}
metadata:
  name: {{ include "service.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
spec:
  {{- if or $sts (not .Values.autoscaling.enabled) }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- if $sts }}
  serviceName: {{ include "service.name" . }}-headless
  {{- with .Values.workload.podManagementPolicy }}
  podManagementPolicy: {{ . }}
  {{- end }}
  {{- with .Values.workload.strategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- else }}
  {{- with .Values.workload.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "service.selectorLabels" . | nindent 8 }}
        service.identity: {{ include "service.name" . }}.{{ .Release.Namespace }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "service.podSpecCommon" (dict "root" . "component" "server") | nindent 6 }}
      {{- with .Values.workload.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      {{- if eq .Values.migrations.mode "init-container" }}
      # DB migrations run to completion before the server starts. For the
      # pre-upgrade Job alternative, set migrations.mode=job (see migration-job.yaml).
      initContainers:
        - name: migrate
          image: {{ include "service.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            {{- range .Values.migrations.command }}
            - {{ . | quote }}
            {{- end }}
          env:
            # Secret-sourced vars first: datastore URLs may compose from them
            # with $(VAR), and so may the plain env that follows.
            {{- range .Values.secrets.keys }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "service.name" $ }}-secrets
                  key: {{ . }}
            {{- end }}
            {{- with include "service.datastoreEnv" . | trim }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- range $k, $v := .Values.migrations.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with include "service.volumeMounts" (dict "root" . "pvc" true) | trim }}
          volumeMounts:
            {{- . | nindent 12 }}
          {{- end }}
      {{- end }}
      containers:
        - name: server
          image: {{ include "service.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: OTEL_SERVICE_NAME
              value: {{ include "service.name" . | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.observability.otlpEndpoint | quote }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace={{ .Release.Namespace }},service.version={{ include "service.version" . }}"
            {{- if .Values.rustService }}
            - name: RUST_LOG
              value: "info"
            {{- end }}
            # Secret-sourced vars first: datastore URLs may compose from them
            # with $(VAR), and so may the plain env that follows.
            {{- range .Values.secrets.keys }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "service.name" $ }}-secrets
                  key: {{ . }}
            {{- end }}
            {{- with include "service.datastoreEnv" . | trim }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - containerPort: {{ .Values.service.port }}
              name: {{ .Values.service.portName }}
            {{- if gt (int .Values.service.httpPort) 0 }}
            - containerPort: {{ .Values.service.httpPort }}
              name: http
            {{- end }}
            {{- if and .Values.mcp.enabled (eq .Values.mcp.mode "in-process") }}
            # In-process MCP: the same server process also serves MCP on this port.
            - containerPort: {{ .Values.service.mcpPort }}
              name: mcp
            {{- end }}
            {{- range .Values.extraPorts }}
            - containerPort: {{ .port }}
              name: {{ .name }}
              protocol: {{ .protocol }}
            {{- end }}
          {{- if .Values.service.health.enabled }}
          {{- if and (not .Values.service.health.grpc) (not .Values.service.health.path) }}
          {{- fail "service.health.grpc is false but service.health.path is empty. A pure gRPC service has no HTTP surface to probe. Either keep grpc: true, or add [service.http] in tonin.toml to expose an HTTP health endpoint, then set service.health.path to its path." }}
          {{- end }}
          {{- $h := .Values.service.health }}
          livenessProbe:
            {{- include "service.probeAction" (dict "root" . "path" ($h.livenessPath | default $h.path)) | nindent 12 }}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            {{- include "service.probeAction" (dict "root" . "path" ($h.readinessPath | default $h.path)) | nindent 12 }}
            periodSeconds: 5
            failureThreshold: 3
          {{- with $h.startup }}
          {{- if .enabled }}
          startupProbe:
            {{- include "service.probeAction" (dict "root" $ "path" (.path | default $h.path)) | nindent 12 }}
            periodSeconds: {{ .periodSeconds }}
            failureThreshold: {{ .failureThreshold }}
          {{- end }}
          {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with include "service.serverVolumeMounts" . | trim }}
          volumeMounts:
            {{- . | nindent 12 }}
          {{- end }}
        {{- if and .Values.mcp.enabled (eq .Values.mcp.mode "sidecar") }}
        # Sidecar MCP: a separate <name>-mcp binary proxying to the gRPC server.
        # Only valid if the image actually ships that binary.
        - name: mcp
          image: {{ include "service.image" . | quote }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command: ["/usr/local/bin/{{ include "service.name" . }}-mcp"]
          env:
            - name: GRPC_ENDPOINT
              value: "http://localhost:{{ .Values.service.port }}"
            - name: OTEL_SERVICE_NAME
              value: "{{ include "service.name" . }}-mcp"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.observability.otlpEndpoint | quote }}
          ports:
            - containerPort: {{ .Values.service.mcpPort }}
              name: mcp
          resources:
            requests: { cpu: "50m",  memory: "64Mi"  }
            limits:   { cpu: "200m", memory: "128Mi" }
        {{- end }}
        {{- if .Values.outboundProxy.enabled }}
        # Outbound proxy sidecar. Auto-injected for non-Rust services with declared
        # depends_on. App connects to localhost:{{ .Values.outboundProxy.port }}; proxy
        # handles coalescing, caching, retry, and circuit breaking.
        - name: tonin-proxy
          image: {{ .Values.outboundProxy.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: TONIN_PROXY_UPSTREAM
              value: "http://localhost:{{ .Values.service.port }}"
            - name: TONIN_PROXY_PORT
              value: {{ .Values.outboundProxy.port | quote }}
            - name: OTEL_SERVICE_NAME
              value: "{{ include "service.name" . }}-proxy"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.observability.otlpEndpoint | quote }}
          ports:
            - containerPort: {{ .Values.outboundProxy.port }}
              name: proxy
          resources:
            requests: { cpu: "50m",  memory: "64Mi"  }
            limits:   { cpu: "200m", memory: "128Mi" }
        {{- end }}
      {{- with include "service.serverVolumes" . | trim }}
      volumes:
        {{- . | nindent 8 }}
      {{- end }}
  {{- if $sts }}
  {{- $claims := list }}
  {{- range .Values.volumes }}
  {{- if eq .type "pvc" }}
  {{- $claims = append $claims . }}
  {{- end }}
  {{- end }}
  {{- with $claims }}
  volumeClaimTemplates:
    {{- range . }}
    - metadata:
        name: {{ .name }}
        labels:
          {{- include "service.selectorLabels" $ | nindent 10 }}
      spec:
        accessModes:
          {{- toYaml .accessModes | nindent 10 }}
        {{- with .storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .size }}
    {{- end }}
  {{- end }}
  {{- end }}
