{{- if and .Values.networkPolicy.enabled (eq .Values.mesh "cilium") }}
{{- $np := .Values.networkPolicy }}
{{- $egress := $np.egress | default dict }}
# CiliumNetworkPolicy for the service's pods: ingress allowlist ([callers])
# and egress (DNS, the otel-collector, [depends_on], datastores, [egress]).
# mTLS, retries, and circuit breaking stay with the mesh, not this policy.
# The migration Job has its own policy (migration-job.yaml), so it is
# excluded here.
# Cilium scopes a peer selector without the k8s:io.kubernetes.pod.namespace
# label to the policy's own namespace, so a peer in another namespace needs
# that label (service.identity alone would match nothing there).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "service.name" . }}-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      service.identity: {{ include "service.name" . }}.{{ .Release.Namespace }}
    matchExpressions:
      - { key: app.kubernetes.io/component, operator: NotIn, values: [migrate] }
  ingress:
    {{- range $np.callers }}
    # caller: {{ .name }}
    - fromEndpoints:
        - matchLabels:
            {{- if .labels }}
            {{- if .namespace }}
            k8s:io.kubernetes.pod.namespace: {{ .namespace }}
            {{- end }}
            {{- range $k, $v := .labels }}
            {{ $k | quote }}: {{ $v | quote }}
            {{- end }}
            {{- else }}
            {{- if ne .namespace $.Release.Namespace }}
            k8s:io.kubernetes.pod.namespace: {{ .namespace }}
            {{- end }}
            service.identity: {{ .name }}.{{ .namespace }}
            {{- end }}
      toPorts:
        - ports:
            {{- if .ports }}
            {{- range .ports }}
            - { port: "{{ . }}", protocol: TCP }
            {{- end }}
            {{- else }}
            - { port: "{{ $np.port }}", protocol: TCP }
            {{- if gt (int $.Values.service.httpPort) 0 }}
            - { port: "{{ $.Values.service.httpPort }}", protocol: TCP }
            {{- end }}
            {{- if $np.mcp }}
            - { port: "{{ $.Values.service.mcpPort }}", protocol: TCP }
            {{- end }}
            {{- end }}
    {{- else }}
    # No callers: an empty rule keeps ingress default-deny (an absent or
    # empty `ingress` list would leave ingress unrestricted).
    - {}
    {{- end }}
  egress:
    # DNS (kube-dns). Any egress rule makes this policy default-deny for the
    # pod, which would otherwise silently break service discovery.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
          {{- if $egress.fqdns }}
          # toFQDNs learns IPs from DNS answers seen by Cilium's DNS proxy;
          # this rule sends lookups through it (and allows any name).
          rules:
            dns:
              - matchPattern: "*"
          {{- end }}
    # The otel-collector is push-only: pods export to it on 4317.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app: otel-collector
      toPorts:
        - ports:
            - { port: "4317", protocol: TCP }
    {{- range $np.dependsOn }}
    # [depends_on] {{ .name }}
    - toEndpoints:
        - matchLabels:
            {{- if ne .namespace $.Release.Namespace }}
            k8s:io.kubernetes.pod.namespace: {{ .namespace }}
            {{- end }}
            service.identity: {{ .name }}.{{ .namespace }}
      toPorts:
        - ports:
            {{- range (.ports | default (list (.port | default 50051))) }}
            - { port: "{{ . }}", protocol: TCP }
            {{- end }}
    {{- end }}
    {{- with include "service.datastoreEgress" . | trim }}
    {{- . | nindent 4 }}
    {{- end }}
    {{- range $egress.fqdns }}
    # [egress] {{ .name | default .pattern }}
    - toFQDNs:
        {{- if .name }}
        - matchName: {{ .name | quote }}
        {{- else }}
        - matchPattern: {{ .pattern | quote }}
        {{- end }}
      toPorts:
        - ports:
            {{- range .ports }}
            - { port: "{{ . }}", protocol: TCP }
            {{- end }}
    {{- end }}
    {{- range $egress.cidrs }}
    # [egress] {{ .cidr }}
    - toCIDRSet:
        - cidr: {{ .cidr | quote }}
          {{- with .except }}
          except:
            {{- range . }}
            - {{ . | quote }}
            {{- end }}
          {{- end }}
      toPorts:
        - ports:
            {{- range .ports }}
            - { port: "{{ . }}", protocol: TCP }
            {{- end }}
    {{- end }}
    {{- if $egress.kubeApiserver }}
    # [egress] kube_apiserver: 443 (Service) and 6443 (the usual endpoint port).
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - { port: "443", protocol: TCP }
            - { port: "6443", protocol: TCP }
    {{- end }}
{{- end }}
