{{- if and .Values.cache.enabled (not .Values.cache.shared) }}
# Headless Service for the cache StatefulSet. Its name is the DNS host the
# server resolves to via REDIS_URL.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.cache.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app: {{ .Values.cache.name }}
  ports:
    - name: {{ .Values.cache.engine }}
      port: {{ .Values.cache.port }}
      targetPort: {{ .Values.cache.port }}
{{- end }}
