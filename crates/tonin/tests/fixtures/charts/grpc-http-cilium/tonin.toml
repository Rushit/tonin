# Golden fixture: gRPC service that also serves HTTP (health on the HTTP
# port), cilium mesh, database + cache, per-env env, and an autoscale range.
# Modelled on the zvectorlabs `zradar-platform` service.
schema = "v1"

[image]
registry = "ghcr.io/example"

[security.pod]
run_as_non_root = true
run_as_user     = 65532
run_as_group    = 65532
fs_group        = 65532

[security.container]
allow_privilege_escalation = false
read_only_root_filesystem  = true

[security.container.capabilities]
drop = ["ALL"]

[security.container.seccomp_profile]
type = "RuntimeDefault"

[service]
name    = "telemetry"
version = "0.2.3"
type    = "grpc"
port    = 4317

[service.http]
port = 8080

[service.health]
path = "/health"
port = 8080

[deploy]
namespace = "telemetry-{env}"
replicas  = 2
mesh      = "cilium"

[deploy.dev]
replicas = 1

[resources]
cpu    = "200m"
memory = "512Mi"

[autoscale]
min_replicas = 1
max_replicas = 4

[database]
engine = "postgres"

[database.dev]
shared = true
url    = "postgresql://postgres:postgres@postgres.shared-dev.svc.cluster.local:5432/telemetry_dev"

[cache]
engine = "redis"

[cache.dev]
shared = true
url    = "redis://redis.shared-dev.svc.cluster.local:6379"

[env]
IDENTITY_GRPC_URL = "http://identity.platform-{env}.svc.cluster.local:50051"

[env.prd]
S3_BUCKET   = "example-prd-telemetry"
S3_ENDPOINT = "https://s3.example.invalid"

[secrets]
required = ["TELEMETRY_SERVICE_TOKEN", "AWS_ACCESS_KEY_ID", "AWS_SECRET_ACCESS_KEY"]

[callers]
platform-api = "platform-{env}"

[depends_on]
identity = "platform-{env}"
