# Golden fixture: HTTP Rust service with a health path, plain env per env,
# secrets, and structured depends_on. Modelled on the zvectorlabs
# `zvectorlabs-api` service. Covers: database/cache env var names overridden
# (PLATFORM_DATABASE_URL, PLATFORM_REDIS_URL), and migrations as a hook Job in
# every env. Network policy: a service caller and a namespace/label caller
# (cloudflared), a dev-only label caller in the same namespace, a dependency
# on several ports, FQDN egress (Stripe) and the kube-apiserver.
schema = "v1"

[image]
registry = "ghcr.io/example"

[security.pod]
run_as_non_root = true
run_as_user     = 65532
run_as_group    = 65532
fs_group        = 65532

[security.container]
allow_privilege_escalation = false
read_only_root_filesystem  = true

[security.container.capabilities]
drop = ["ALL"]

[security.container.seccomp_profile]
type = "RuntimeDefault"

[service]
name    = "platform-api"
version = "0.1.3"
type    = "http"
port    = 7001

[service.health]
path = "/health"
port = 7001

[deploy]
namespace   = "platform-{env}"
replicas    = 1
mcp_sidecar = false

[deploy.prd]
replicas = 2

[resources]
cpu    = "250m"
memory = "256Mi"

[secrets]
required = ["TELEMETRY_SERVICE_TOKEN"]

[database]
engine = "postgres"
env    = "PLATFORM_DATABASE_URL"

[cache]
engine = "redis"
env    = "PLATFORM_REDIS_URL"

[migrations]
tool    = "custom"
mode    = "job"
command = ["/usr/local/bin/platform-api", "migrate"]

[env]
PLATFORM_SERVER_PORT = "7001"
IDENTITY_GRPC_ADDR   = "http://identity.platform-{env}.svc.cluster.local:50051"
TELEMETRY_URL        = "http://telemetry.telemetry-{env}.svc.cluster.local:8080"

[env.dev]
PLATFORM_SERVER_ALLOWED_ORIGINS = "http://localhost:7002"

[callers]
web-shell   = "platform-{env}"
cloudflared = { namespace = "edge", labels = { "app.kubernetes.io/name" = "cloudflared" } }

[callers.dev]
dev-proxy = { labels = { app = "dev-proxy" }, ports = [7001] }

[depends_on]
identity  = "platform-{env}"
telemetry = { namespace = "telemetry-{env}", ports = [8080, 8081, 8082] }

[egress]
fqdns          = [{ name = "api.stripe.com", ports = [443] }]
kube_apiserver = true
