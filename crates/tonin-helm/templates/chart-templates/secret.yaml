{{- if and .Values.secrets.create .Values.secrets.values }}
# Secret holding every key the service requires (DATABASE_PASSWORD, JWT keys, …).
# Populated from .Values.secrets.values — supply real values at deploy time
# (`--set secrets.values.KEY=...` or a private values file); never commit them.
# Keys with no value provided are simply omitted (the pod fails fast at runtime
# until they're supplied). Set secrets.create=false to reference an
# externally-managed Secret of the same name instead.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "service.name" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets.values }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
