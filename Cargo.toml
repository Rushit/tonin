[workspace]
resolver = "2"
members = [
    "crates/tonin",
    "crates/tonin-plugin",
    "crates/tonin-sdk",
    "crates/tonin-client",
    "crates/tonin-mcp-macros",
    "crates/tonin-build",
    "crates/tonin-config-etcd",
    "crates/tonin-config-github",
    "crates/tonin-proxy",
    "examples/greeter",
    "examples/orders",
    "examples/inventory",
    "examples/users-service",
    "examples/orders-service",
    "examples/products-service",
]

[workspace.package]
version = "0.14.0"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"
repository = "https://github.com/Rushit/tonin"
homepage = "https://github.com/Rushit/tonin"
readme = "README.md"
keywords = ["microservice", "grpc", "kubernetes", "tonic", "framework"]
categories = ["network-programming", "web-programming", "development-tools"]

[workspace.dependencies]
tonin            = { path = "crates/tonin",           version = "0.14.0" }
tonin-plugin     = { path = "crates/tonin-plugin",    version = "0.14.0" }
tonin-sdk        = { path = "crates/tonin-sdk",       version = "0.14.0" }
tonin-client     = { path = "crates/tonin-client",    version = "0.14.0" }
tonin-mcp-macros = { path = "crates/tonin-mcp-macros", version = "0.14.0" }
tonin-build      = { path = "crates/tonin-build",     version = "0.14.0" }

tokio        = { version = "1", features = ["full"] }
tonic        = "0.14"
tonic-prost  = "0.14"
dashmap      = "6"
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["net"] }
tonic-prost-build = "0.14"
prost       = "0.14"
prost-types = "0.14"
tower       = "0.5"
hyper            = "1"
http             = "1"
http-body-util   = "0.1"
async-trait = "0.1"
thiserror   = "2"
anyhow      = "1"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
serde_yaml  = "0.9"
toml        = "0.8"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap        = { version = "4", features = ["derive", "env"] }
reqwest     = { version = "0.13", default-features = false, features = ["stream", "rustls"] }
flate2      = "1"
tar         = "0.4"

# tonin-proxy release profile — size-optimised sidecar binary.
# opt-level=z + LTO + single CGU typically saves 25-35% vs the default release.
# Applied only when building with --profile proxy-release; normal workspace
# releases (CLI, SDK) use the default release profile unchanged.
[profile.proxy-release]
inherits      = "release"
opt-level     = "z"
lto           = true
codegen-units = 1
strip         = true
