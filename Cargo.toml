[workspace]
resolver = "2"
members = [
    "crates/tonin",
    "crates/tonin-plugin",
    "crates/tonin-sdk",
    "crates/tonin-client",
    "crates/tonin-mcp-macros",
    "crates/tonin-build",
    "crates/tonin-config-etcd",
    "crates/tonin-config-github",
    "examples/greeter",
    "examples/orders",
    "examples/inventory",
]

[workspace.package]
version = "0.7.0" # x-release-please-version
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/Rushit/tonin"
homepage = "https://github.com/Rushit/tonin"
readme = "README.md"
keywords = ["microservice", "grpc", "kubernetes", "tonic", "framework"]
categories = ["network-programming", "web-programming", "development-tools"]

[workspace.dependencies]
tonin            = { path = "crates/tonin",           version = "0.7.0" }
tonin-plugin     = { path = "crates/tonin-plugin",    version = "0.7.0" }
tonin-sdk        = { path = "crates/tonin-sdk",       version = "0.7.0" }
tonin-client     = { path = "crates/tonin-client",    version = "0.7.0" }
tonin-mcp-macros = { path = "crates/tonin-mcp-macros", version = "0.7.0" }
tonin-build      = { path = "crates/tonin-build",     version = "0.7.0" }

tokio        = { version = "1", features = ["full"] }
tonic        = "0.12"
dashmap      = "6"
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["net"] }
tonic-build = "0.12"
prost       = "0.13"
prost-types = "0.13"
tower       = "0.5"
hyper       = "1"
http        = "1"
async-trait = "0.1"
thiserror   = "1"
anyhow      = "1"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
serde_yaml  = "0.9"
toml        = "0.8"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap        = { version = "4", features = ["derive"] }
reqwest     = { version = "0.12", features = ["stream"] }
flate2      = "1"
tar         = "0.4"
